<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Negócio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f3f4f6;
  color: #111827;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.05);
}

.card h3 {
  margin-bottom: 10px;
  font-size: 1rem;
}

.card p {
  font-size: 1.2rem;
  font-weight: bold;
}

.actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #4f46e5;
  color: white;
  font-size: 0.95rem;
}

.log {
  margin-top: 20px;
  background: white;
  padding: 15px;
  border-radius: 10px;
  height: 200px;
  overflow-y: auto;
  font-size: 0.9rem;
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Simulador de Negócio</h1>
    <p>Gerencie sua empresa mês a mês</p>
  </header>

  <section class="cards">
    <div class="card">
      <h3>Mês</h3>
      <p id="month">1</p>
    </div>
    <div class="card">
      <h3>Caixa</h3>
      <p id="cash">R$ 10.000</p>
    </div>
    <div class="card">
      <h3>Receita Mensal</h3>
      <p id="revenue">R$ 3.000</p>
    </div>
    <div class="card">
      <h3>Despesas Mensais</h3>
      <p id="expenses">R$ 2.000</p>
    </div>
  </section>

  <section class="actions">
    <button onclick="investMarketing()">Investir em Marketing</button>
    <button onclick="hireEmployee()">Contratar Funcionário</button>
    <button onclick="cutCosts()">Cortar Custos</button>
    <button onclick="nextMonth()">Avançar Mês</button>
  </section>

  <div class="log" id="log"></div>
</div>

<script>
let state = {
  month: 1,
  cash: 10000,
  revenue: 3000,
  expenses: 2000
};

const monthEl = document.getElementById("month");
const cashEl = document.getElementById("cash");
const revenueEl = document.getElementById("revenue");
const expensesEl = document.getElementById("expenses");
const logEl = document.getElementById("log");

function updateUI() {
  monthEl.textContent = state.month;
  cashEl.textContent = `R$ ${state.cash.toFixed(2)}`;
  revenueEl.textContent = `R$ ${state.revenue.toFixed(2)}`;
  expensesEl.textContent = `R$ ${state.expenses.toFixed(2)}`;
}

function addLog(message) {
  const p = document.createElement("p");
  p.textContent = `Mês ${state.month}: ${message}`;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}

function investMarketing() {
  if (state.cash < 1000) {
    addLog("Caixa insuficiente para marketing.");
    return;
  }

  state.cash -= 1000;
  state.revenue += 500;
  addLog("Investiu em marketing. Receita aumentou.");
  updateUI();
}

function hireEmployee() {
  if (state.cash < 2000) {
    addLog("Caixa insuficiente para contratar funcionário.");
    return;
  }

  state.cash -= 2000;
  state.expenses += 800;
  state.revenue += 300;
  addLog("Funcionário contratado. Despesas e receita aumentaram.");
  updateUI();
}

function cutCosts() {
  if (state.expenses <= 500) {
    addLog("Não é possível cortar mais custos.");
    return;
  }

  state.expenses -= 300;
  state.revenue -= 200;
  addLog("Custos cortados. Receita diminuiu.");
  updateUI();
}

function nextMonth() {
  const profit = state.revenue - state.expenses;
  state.cash += profit;
  state.month++;

  if (state.cash <= 0) {
    alert("Sua empresa faliu.");
    location.reload();
    return;
  }

  addLog(`Resultado do mês: ${profit >= 0 ? "Lucro" : "Prejuízo"} de R$ ${profit.toFixed(2)}`);
  updateUI();
}

updateUI();
</script>

</body>
</html>
